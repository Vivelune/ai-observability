name: ai-observability

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: ai-observability-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: ai-observability-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ai-observability-clickhouse
    environment:
      CLICKHOUSE_DB: aiobs
      CLICKHOUSE_USER: aiobs
      CLICKHOUSE_PASSWORD: aiobs_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # native
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  postgres:
    image: postgres:16-alpine
    container_name: ai-observability-postgres
    environment:
      POSTGRES_USER: aiobs
      POSTGRES_PASSWORD: aiobs_dev
      POSTGRES_DB: aiobs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiobs -d aiobs"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-observability-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redpanda-data:
  clickhouse-data:
  redis-data:
  postgres-data:
